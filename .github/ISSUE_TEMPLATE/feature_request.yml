name: 功能建议
description: 提出可以让项目更实用、更可靠的改进。
title: "[功能建议] "
body:
  - type: markdown
    attributes:
      value: |
        欢迎提出建议。请先说明你遇到的问题，而不只是指定某一种实现方式。不要提交真实主机数据、密钥或私人配置。
  - type: textarea
    id: problem
    attributes:
      label: 你希望解决什么问题？
      description: 描述当前的工作流程、限制或实际需求。
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 你建议的解决方式
      description: 说明希望增加或改变什么，以及期望的使用体验。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 其他可能的做法、临时办法或相关工具（如有）。
  - type: dropdown
    id: scope
    attributes:
      label: 建议涉及的方向
      options:
        - Python 日报与检查逻辑
        - README 或中文文档
        - 测试与兼容性
        - systemd 定时任务
        - Beszel、Docker 或外部数据源
        - 其他
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 补充背景
      description: 可以提供脱敏示例、使用场景或限制条件；不要提交密钥或真实生产数据。
